[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "time-travel-clipboard"
version = "0.1.0"
description = "Local-first time-travel clipboard for terminals with keyboard and mouse TUI"
requires-python = ">=3.10"

[project.scripts]
ttc = "main:main"

[tool.setuptools]
py-modules = ["clipboard_win", "context", "main", "store", "tui"]
